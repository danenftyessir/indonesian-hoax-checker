# Pengaturan pipeline (dibaca pipeline/stages.py dan orchestrator).

ner:
  # Dua model IndoBERT-p1 seed 42 dipakai bersama (docs/decisions/0012-layer-entitas-dan-claim-terpisah.md).
  # Checkpoint dari Drive hasil_training (ner_checkpoints_seed42.zip), diekstrak ke artifacts/checkpoints/ner/.
  # checkpoint = null -> mode stub: entitas kosong, supaya task 2 dan 3 bisa jalan sebelum model tersedia.
  checkpoint: artifacts/checkpoints/ner/ner_indobert_entity_seed42   # PER, ORG, LOC, TIME
  claim_checkpoint: artifacts/checkpoints/ner/ner_indobert_claim_seed42   # span CLAIM; null = CLAIM tidak diprediksi
  device: auto

classification:
  # Checkpoint IndoBERT-p1 dari classification/finetune_indobert.py --save-dir (model + tokenizer).
  # Folder tidak ada = mode percobaan (valid, skor 0,5), Skor model belum dikalibrasi
  checkpoint: artifacts/checkpoints/classifier/indobert_seed13
  max_length: 256
  # Teks dengan kata kurang dari ini tidak dinilai classifier (model cenderung menjawab hoax untuk teks pendek); 0 = nonaktif
  min_words: 30
  device: auto
