[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesian-hoax-checker"
version = "0.1.0"
description = "NLP-based Indonesian hoax detection and claim verification system"
requires-python = ">=3.10"

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
