[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesian-hoax-checker"
version = "0.1.0"
description = "NLP-based Indonesian hoax detection and claim verification system"
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies: keep in sync with requirements/base.txt.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
# Keep in sync with requirements/training.txt and requirements/dev.txt.
training = [
    "datasets>=2.18",
    "accelerate>=0.27",
    "seqeval>=1.2.2",
    "pytorch-crf>=0.7.2",
    "huggingface-hub>=0.22",
    "kaggle>=1.6",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
hoax-checker = "indonesian_hoax_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
